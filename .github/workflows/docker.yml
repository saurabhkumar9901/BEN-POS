name: image

# Builds benpos-desk on every push and publishes to GHCR, so Azure never
# needs a local `docker build`. The image is data-free (safe public).
on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - deploy/start.sh
      - frontend/**
      - src/**
      - requirements.txt
      - company_map.csv
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
