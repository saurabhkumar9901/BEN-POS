services:
  - type: web
    name: benpos-ingest
    runtime: docker
    dockerfilePath: ./service/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: WORK_ROOT
        value: /tmp/benpos
      - key: MD_DATABASE
        value: benpos
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: MOTHERDUCK_TOKEN
        sync: false
